name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: logs') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log | grep -vE "^(Download|\s*$)" | tail -40

      - name: Report javac errors as single-line annotations
        if: failure()
        run: |
          python3 - <<'PYEOF'
          log = open("build.log", encoding="utf-8", errors="replace").read()
          lines = log.splitlines()
          i = 0
          reported = 0
          while i < len(lines) and reported < 40:
              line = lines[i]
              if ": error: " in line:
                  head = line[:700]
                  extra = []
                  j = i + 1
                  while j < len(lines) and ("symbol:" in lines[j][:30] or "location:" in lines[j][:30]) and ": error: " not in lines[j]:
                      extra.append(lines[j].strip())
                      j += 1
                  if extra:
                      head = head + " {" + " | ".join(extra) + "}"
                  print("::error::" + head[:1000])
                  reported += 1
                  i = j
              else:
                  i += 1
          for t in [l for l in lines[-10:] if l.strip()][-5:]:
              print("::error::LOG " + t[:900])
          PYEOF

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volunteera
          path: build/libs/*.jar

  release:
    runs-on: ubuntu-latest
    needs: build
    if: "${{ contains(github.event.head_commit.message, '[release]') }}"
    permissions:
      contents: write
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          name: volunteera
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-mc26.2
          name: "Volunteera 0.1.0 (Minecraft 26.2)"
          body: |
            Fabric mod for **Minecraft 26.2**.

            ### Requirements
            - Minecraft **26.2**
            - Fabric Loader **>= 0.19.5**
            - Fabric API (a recent 26.2 build)

            ### Install
            Drop the jar into your `mods` folder.

            ### Contents
            - 3 origins (Emberborn, Skyborne, Deepforge) with 30 unique abilities
            - XP progression + 3 world-ability trials
            - HUD + origins menu (O by default), 6 ability hotkey slots
            - `/volunteera` admin & testing commands (permission level 2)
          files: |
            dist/*.jar
          fail_on_unmatched_files: true
