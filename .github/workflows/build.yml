name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: logs') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log | grep -vE "^(Download|\s*$)" | tail -50

      - name: Save build log to branch
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build.log ci-logs/build.log
          git add ci-logs/build.log
          git commit -m "ci: logs for ${{ github.sha }}"
          git push

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volunteera
          path: build/libs/*.jar
