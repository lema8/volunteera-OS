name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: logs') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log | grep -vE "^(Download|\s*$)" | tail -40

      - name: Report javac errors as single-line annotations
        if: failure()
        run: |
          python3 - <<'PYEOF'
          log = open("build.log", encoding="utf-8", errors="replace").read()
          lines = log.splitlines()
          i = 0
          reported = 0
          while i < len(lines) and reported < 40:
              line = lines[i]
              if ": error: " in line:
                  head = line[:700]
                  extra = []
                  j = i + 1
                  while j < len(lines) and ("symbol:" in lines[j][:30] or "location:" in lines[j][:30]) and ": error: " not in lines[j]:
                      extra.append(lines[j].strip())
                      j += 1
                  if extra:
                      head = head + " {" + " | ".join(extra) + "}"
                  print("::error::" + head[:1000])
                  reported += 1
                  i = j
              else:
                  i += 1
          for t in [l for l in lines[-10:] if l.strip()][-5:]:
              print("::error::LOG " + t[:900])
          PYEOF

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volunteera
          path: build/libs/*.jar
