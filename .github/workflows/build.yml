name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: logs') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log | grep -vE "^(Download|\s*$)" | tail -50

      - name: Report full javac error blocks as annotations
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import re

          log = open("build.log", encoding="utf-8", errors="replace").read()
          lines = log.splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if ": error: " in line:
                  block = [line]
                  j = i + 1
                  while j < len(lines) and (lines[j].startswith("  symbol:") or lines[j].startswith("  location:")):
                      block.append(lines[j])
                      j += 1
                  blocks.append("\n".join(block))
                  i = j
              else:
                  i += 1
          print(f"total error blocks: {len(blocks)}")
          for b in blocks[:48]:
              msg = b.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{msg}")
          # failure summary
          for marker in ("FAILURE: Build failed", "What went wrong:", "* Exception is:"):
              if marker in log:
                  idx = lines.index(marker) if marker in lines else -1
                  if idx >= 0:
                      chunk = "\n".join(lines[idx:idx+25]).replace("%", "%25").replace("\n", "%0A")
                      print(f"::error::{chunk[:3800]}")
          PYEOF

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volunteera
          path: build/libs/*.jar
