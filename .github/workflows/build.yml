name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: logs') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log | grep -vE "^(Download|\s*$)" | tail -40

      - name: Report javac errors as single-line annotations
        if: failure()
        run: |
          python3 - <<'PYEOF'
          log = open("build.log", encoding="utf-8", errors="replace").read()
          lines = log.splitlines()
          i = 0
          reported = 0
          while i < len(lines) and reported < 45:
              line = lines[i]
              if ": error: " in line:
                  print("::error::" + line[:1000])
                  reported += 1
                  j = i + 1
                  while j < len(lines) and (lines[j].startswith("  symbol:") or lines[j].startswith("  location:")):
                      print("::error::    " + lines[j].strip()[:900])
                      j += 1
                  i = j
              else:
                  i += 1
          tail = [l for l in lines[-12:] if l.strip()]
          for t in tail[:6]:
              print("::error::LOG " + t[:900])
          PYEOF

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volunteera
          path: build/libs/*.jar
