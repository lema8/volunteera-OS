[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lema-harness"
version = "0.1.0"
description = "Lema Harness - a fully extensible, provider-agnostic AI coding-agent runtime for the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lema8" }]
keywords = ["ai", "agent", "cli", "coding-agent", "llm", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.24",
    "rich>=13.0",
    "prompt_toolkit>=3.0.30",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "anyio>=3.0"]

[project.scripts]
lema = "lema.main:main"

[project.urls]
Homepage = "https://github.com/lema8/volunteera-OS"

[tool.setuptools.packages.find]
include = ["lema*"]

[tool.setuptools.package-data]
"lema.skills" = ["builtin/*.md", "builtin/**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
